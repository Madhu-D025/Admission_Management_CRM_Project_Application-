    <script>
      function initMultiSelectFuncation() {
        $(document).ready(function () {
          setTimeout(() => {
            $(".select2").select2();
          }, 1000);
        });
      }

      function initDatePickerFuncation() {
        $(document).ready(function () {
          setTimeout(() => {
            $("[data-mask]").inputmask();

            if ($.fn.dataTable.isDataTable("#example1")) {
            } else {
              $("#example1")
                .DataTable({
                  responsive: true,
                  lengthChange: false,
                  autoWidth: false,
                  buttons: ["copy", "csv", "excel", "pdf", "print", "colvis"],
                })
                .buttons()
                .container()
                .appendTo("#example1_wrapper .col-md-6:eq(0)");
            }
          }, 2000);
        });
      }

      function confirmModalShow() {
        $("#confirmCommonModal").modal("show");
      }
      function confirmModalHide() {
        $("#confirmCommonModal").modal("hide");
      }

      $(document).on("click", ".toggle-password", function () {
        $(this).toggleClass("fa-eye fa-eye-slash");

        var input = $($(this).attr("toggle"));
        if (input.attr("type") === "password") {
          input.attr("type", "text");
        } else {
          input.attr("type", "password");
        }
      });

      function scroller() {
        var scroll = $("div.scroll");

        var height = scroll.height();

        var topAdj = -height - 30;
        scroll.animate(
          {
            top: [topAdj, "linear"],
          },
          33000,
          function () {
            scroll.css("top", 80);
            scroller();
          }
        );
      }

      function initScroller() {
        scroller();
      }
    </script>
